[project]
name = "ai-task-runner"
version = "0.1.0"
description = "Pluggable bridge between a task manager and a coding agent"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.scripts]
ai-task-runner = "runner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
