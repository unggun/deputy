# ===========================================================================
# deputy — per-developer laptop config
# Copy to config.yaml. Secrets come from env vars, never inline.
#
# Structure:
#   sources      one task-manager workspace each, with its own repos
#   vcs_profiles named git/GitHub identities, referenced by repos
# ===========================================================================

runner:
  id: my-laptop            # unique per machine; used for lease ownership
  mode: shadow               # shadow = triage + comment only | execute = full loop
  db_path: ~/.deputy/state.db
  work_dir: ~/.deputy/work    # isolated git worktrees live here
  log_dir: ~/.deputy/logs
  brain_dir: ~/.deputy/brain  # durable per-repo notes, one .md per repo
  # Scorer files (a rubric each) that judge finished plan/implement/review/fix
  # runs from their logs. No directory, or no files in it, means scoring is
  # off and costs nothing. Starters are in examples/scorers/; try one with
  # `deputy score NAME` before copying it in.
  # scorers_dir: ~/.deputy/scorers
  # The improve station: reads one repo's failed scorer verdicts and the
  # reviews that asked for changes, and proposes at most one brain note that
  # would have prevented them. It only proposes: `deputy improve accept ID`
  # is what writes the brain. Off unless enabled; try it on one repo first
  # with `deputy improve run --repo KEY`.
  # improve:
  #   enabled: false
  #   min_evidence: 5        # failures no earlier run has seen, on one repo...
  #   max_age_days: 7        # ...or one this old, before a run
  #   lookback_days: 30      # older failures are not evidence any more
  #   max_per_run: 1         # improve runs per tick, per source
  #   max_evidence: 20       # failures shown to one run, oldest first
  bot_marker: "<!-- ai-runner -->"
  days: [mon, tue, wed, thu, fri]
  windows:                   # local time; the OS scheduler fires every 15 min
    advance: ["07:00-20:00"] # PR/CI polling — cheap, no LLM
    triage:  ["06:30-08:30", "11:00-12:00", "14:00-15:30"]
    execute: ["06:30-16:00"] # hard stop so every PR gets same-day review time
    # score: [...]           # when scorers judge runs; defaults to `triage`
    # improve: [...]         # when the improve station runs; defaults to `triage`
  limits:
    max_active_tasks: 3      # across ALL sources — this caps load on this laptop
    max_new_triage_per_run: 10
    max_fix_attempts: 3
    max_review_cycles: 2     # implementer <-> reviewer round trips before we
                             # give up and ask a human. Separate from
                             # max_fix_attempts, which covers crashes and CI.
    agent_timeout_minutes: 45
    daily_budget_usd: 15
    # Tokens are the *other* daily limit, and on a claude.ai login they are the
    # one that actually bites. `total_cost_usd` from the CLI prices the run as
    # if it were API traffic; with a subscription that money is never billed,
    # while the 5-hourly/weekly quota it really consumes goes unmeasured by
    # `daily_budget_usd`. This counts input + output + cache tokens, the same
    # units the quota is in. 0 (or omitted) disables the token gate; both
    # limits are checked before every agent run and whichever trips first
    # stops the tick.
    daily_tokens: 0
    brain_max_bytes: 8000    # per-repo note file cap; at the cap appends are
                             # refused and logged, never silently evicted
    # Judge runs per tick, across all scorers, and how far back to look for
    # runs not yet judged. Each judge is one tool-less turn on the scorer's
    # model, counted against both daily limits like any other agent run.
    max_scores_per_run: 5
    score_lookback_days: 14

agent:
  type: claude_code
  binary: claude             # uses THIS developer's own Claude login
  model: sonnet              # work() — the 60-turn implementation run
  # reason() — one-turn, tool-less triage classification. Falls back to
  # `model` if unset. NOTE: on a Claude subscription (not an API key) every
  # call spends your 5-hourly/weekly quota, and opus draws on it far harder
  # than sonnet. Set this to opus only if the runner has its own
  # ANTHROPIC_API_KEY, or if you accept the quota cost.
  triage_model: sonnet
  # reviewer() — the independent review pass over the pushed branch. Falls back
  # to `model` when unset. Claude Code is Claude-only, so this cannot give you
  # Foreman's cross-vendor independence; a different tier plus a fresh session
  # and a diff-only prompt is what we get. Prefer a *stronger* model here than
  # the implementer if you can afford it: catching a bad change is worth more
  # than writing one slightly faster.
  reviewer_model: sonnet
  # The scoring judge, unless a scorer file names its own `model:`. Falls back
  # to `triage_model`: it is the same one-turn, tool-less, isolated call.
  # scorer_model: haiku
  # The improve station: work() with `planner_tools`, in a read-only checkout
  # of the base branch, like the analyst. Falls back to `model`. A stronger
  # model pays off here: it runs rarely, and a bad note reaches every prompt.
  # improve_model: opus
  max_turns: 60
  permission_mode: dontAsk
  timeout_minutes: 45
  max_budget_usd: 2.0
  # Per-run cap on the JSONL event log under `runner.log_dir`. work() streams
  # the agent's output there as it is produced, so a run that is killed still
  # leaves evidence. At the cap the log records that it stopped rather than
  # dropping the file or blocking the agent's pipes.
  max_log_bytes: 33554432    # 32 MiB
  # Ceiling on the prompt, which travels in argv. Past the kernel's limit the
  # exec fails as a bare OSError; the runner refuses first, with a message an
  # operator can act on, and spends nothing. Defaults to 400000 on macOS and
  # 120000 on Linux, which caps any single argument at 128 KiB. Both leave
  # plenty of room for a real ticket, so tripping this normally means a
  # description or comment thread that wants trimming, not a limit that wants
  # raising.
  # max_prompt_bytes: 400000
  # Triage (`reason()`) is a tool-less classification of ticket text, so it
  # runs in this empty directory with MCP servers, skills and settings turned
  # off. Otherwise `claude` loads the CLAUDE.md, settings and git state of
  # whatever directory cron happened to launch the runner from, and triage
  # answers about *that* project instead of the ticket. A fixed path, not a
  # temp dir: the cwd is part of the system prompt, so a changing path misses
  # the prompt cache on every call.
  triage_dir: ~/.deputy/triage
  isolate_triage: true       # false restores the pre-fix behaviour
  # `Agent` lets work() dispatch subagents. Subagent definitions come from
  # .claude/agents/*.md in the target repo, since work() runs with the
  # worktree as its cwd. Remove it to forbid subagents entirely.
  allowed_tools:
    [Read, Write, Edit, Glob, Grep, Agent, "Bash(git:*)", "Bash(pnpm:*)",
     "Bash(npm:*)", "Bash(go:*)", "Bash(pytest:*)"]
  # The analyst station reads the repo to write the plan. Read-only by
  # construction — this is what makes planning safe in shadow mode. Adding a
  # write tool here silently breaks that promise.
  planner_tools: [Read, Glob, Grep, "Bash(git log:*)", "Bash(git diff:*)"]
  # The reviewer station reads the pushed diff and re-runs cheap checks. The
  # repo's own `test` command is appended to this list at call time, so the
  # reviewer can verify the implementer's claims instead of trusting them.
  reviewer_tools: [Read, Glob, Grep, "Bash(git log:*)", "Bash(git diff:*)"]

# --- GitHub / git identities ----------------------------------------------
# One entry per GitHub account. Repos reference these by name.
# Prefer token_env (simplest, parallel-safe). gh_config_dir works too.
# NEVER rely on `gh auth switch` — it mutates global state and races.
vcs_profiles:
  work:
    host: github.com
    token_env: GH_TOKEN_WORK          # a PAT for the MyCorp account
    ssh_key: ~/.ssh/id_ed25519_work
    git_user_name: "Your Name (AI Runner)"
    git_user_email: you@mycorp.example
    reviewer_allowlist: [your-github-user, tech-lead-1, senior-dev-2]

  client-acme:
    host: github.com
    gh_config_dir: ~/.config/gh-acme  # separate `gh` tree: GH_CONFIG_DIR=... gh auth login
    ssh_key: ~/.ssh/id_ed25519_acme
    git_user_name: "AI Runner"
    git_user_email: dev@acme-client.com
    reviewer_allowlist: [acme-lead]

vcs:
  default_profile: work
  draft_prs: true

policy:
  min_execute_confidence: 0.75
  block_large_scope: true
  require_plan_approval_from_scope: m   # xs/s go straight through; m/l need a human OK
  approval_keywords: ["approved", "go ahead", "lgtm", "proceed"]
  rejection_keywords: ["no", "stop", "hold", "wait", "don't"]
  # denylist_patterns: [...]  # omit to use the built-in defaults in triage.py
  # A human's way past a denylist false positive: add this tag (Jira: label)
  # and set AI State back to `new`. Triage then skips the denylist for that
  # ticket only, and the plan always waits for approval. "" disables it.
  override_tag: ai-override

# --- Sources ---------------------------------------------------------------
sources:
  # A ClickUp personal API token covers every workspace you belong to, so the
  # same ${CLICKUP_TOKEN} can appear under several sources with different team_ids.
  - key: mycorp
    provider:
      type: clickup
      token: ${CLICKUP_TOKEN}
      team_id: "9012345678"
      lists: ["901100000001", "901100000002"]
      ready_status: "to do"          # + assignee filter, applied automatically
      in_progress_status: "in progress"
      review_status: "code review"
      done_status: "done"
      skip_tags: ["no-ai", "spike"]
      state_backend: custom_field    # custom_field | tag
      state_field_id: "00000000-0000-0000-0000-000000000000"
      # REQUIRED: every AIState value needs an option here, or set_ai_state raises
      # the moment a ticket reaches it. `new`, `planning` and `review` are not
      # optional either — `new` is a pre-existing gap (a rejected plan sends a
      # ticket back to NEW) and `planning`/`review` were added in the station
      # release. Create all three options in the ClickUp dropdown first, then
      # paste their ids here.
      state_field_options:           # state value -> ClickUp dropdown option id
        new:         "opt-uuid-0"
        needs-input: "opt-uuid-1"
        human-only:  "opt-uuid-2"
        plan-review: "opt-uuid-3"
        planning:    "opt-uuid-9"
        queued:      "opt-uuid-4"
        in-progress: "opt-uuid-5"
        review:      "opt-uuid-10"
        pr-open:     "opt-uuid-6"
        blocked:     "opt-uuid-7"
        done:        "opt-uuid-8"
    repos:
      - key: pulse-backend
        containers: ["901100000001"]     # ClickUp list ids that map here
        vcs_profile: work
        path: ~/code/pulse-backend
        remote: git@github.com:mycorp/pulse-backend.git
        base_branch: main
        language: "NestJS / TypeScript / Postgres"
        setup: "pnpm install --frozen-lockfile"
        test: "pnpm test"
        notes: "Domain modules under src/modules. Every endpoint needs an e2e test."
      - key: pulse-frontend
        containers: ["901100000002"]
        vcs_profile: work
        path: ~/code/pulse-frontend
        remote: git@github.com:mycorp/pulse-frontend.git
        base_branch: main
        language: "Next.js / TypeScript"
        setup: "pnpm install --frozen-lockfile"
        test: "pnpm test && pnpm lint"

  # A second ClickUp workspace — different team_id, different repos, own token.
  - key: sideproject
    enabled: false
    provider:
      type: clickup
      token: ${CLICKUP_TOKEN_SIDE}
      team_id: "9087654321"
      ready_status: "to do"
    repos:
      - key: sideproject-app
        vcs_profile: work        # single repo in this source: no `containers` needed
        path: ~/code/sideproject-app
        remote: git@github.com:your-github-user/sideproject-app.git
        base_branch: main
        test: "npm test"

  # A Jira client. State lives in an issue entity property (no Jira admin
  # required); only needs-input / human-only / plan-review / blocked get a label.
  - key: acme
    provider:
      type: jira
      site: acme.atlassian.net
      email: ${JIRA_EMAIL}
      token: ${JIRA_TOKEN}           # Atlassian API token
      projects: ["ACME"]
      ready_status: "To Do"
      in_progress_status: "In Progress"
      review_status: "In Review"
      done_status: "Done"
      skip_labels: ["no-ai"]
      # Optional opt-IN gate. Omit it (the default) and every ready issue
      # assigned to you is a candidate. Set it when a non-engineer files the
      # tickets and a human breaks them down first: only issues carrying ALL
      # of these labels get triaged. Applies to new tickets only -- in-flight
      # rows are re-read by key and keep advancing.
      # require_labels: ["ai-ready"]
    # Two repos behind ONE Jira project. Nothing in the ticket metadata tells
    # them apart, so triage routes: it is shown each repo's key, language and
    # notes and returns the ones that need a change. A ticket that spans both
    # gets one row per repo -- separate branch, PR and review -- and the Jira
    # AI State field shows the least advanced of them. Routing is only as good
    # as `language` and `notes`; triage never reads the repo itself.
    repos:
      - key: acme-api
        containers: ["ACME"]           # Jira project keys
        vcs_profile: client-acme
        path: ~/code/acme-api
        remote: git@github.com:acme-client/api.git
        base_branch: develop
        language: "Go"
        notes: >-
          Backend. Endpoints, business rules, persistence, background jobs.
        setup: "go mod download"
        test: "go test ./..."
      - key: acme-web
        containers: ["ACME"]           # same project as acme-api, on purpose
        vcs_profile: client-acme
        path: ~/code/acme-web
        remote: git@github.com:acme-client/web.git
        base_branch: develop
        language: "React + TypeScript"
        notes: >-
          Frontend. Pages, components, forms, client-side state, styling.
        setup: "npm ci"
        test: "npm test"
